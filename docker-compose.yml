services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: votechain
      POSTGRES_PASSWORD: votechain_dev
      POSTGRES_DB: votechain
    ports:
      - "5433:5432"
    volumes:
      - votechain-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U votechain -d votechain"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  votechain-postgres: